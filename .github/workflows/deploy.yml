name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "[INFO] Atualizando site..."
            find ~/BlackHorses/.git -not -user black-horses -exec chown black-horses:black-horses {} + 2>/dev/null || true
            cd ~/BlackHorses
            git fetch origin
            git reset --hard origin/main
            echo "[INFO] Deploy finalizado com sucesso!"

      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
            echo "[INFO] Cloudflare cache purgado."
          else
            echo "[SKIP] CF_ZONE_ID ou CF_API_TOKEN não configurados — pulando purge."
          fi
