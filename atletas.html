<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/images/logos/logo_transparent.png" type="image/png">
  <meta name="description" content="Atletas e conquistas da Black Horses. Competidores de alto nível em Boxe, Muay Thai e Hapkido em Porto Alegre.">
  <title>Atletas — Black Horses</title>
  <link rel="stylesheet" href="assets/css/bh-style.css">
  <link rel="stylesheet" href="assets/css/atletas.css">
</head>
<body>
  <script src="assets/components/nav.js"></script>

  <!-- Loading -->
  <div id="bh-loading">
    <img src="assets/images/logos/logo_redux_transparent.webp" alt="" class="load-icon">
    <div class="load-bar"><div class="load-bar-fill"></div></div>
  </div>

  <!-- Hero -->
  <div class="page-hero">
    <img src="assets/images/photo_atletas.webp" alt="Atletas Black Horses">
    <div class="page-hero-fade"></div>
    <div class="page-hero-content">
      <div class="page-eyebrow">Competição &amp; Dedicação</div>
      <h1 class="page-title">Atletas</h1>
    </div>
  </div>

  <!-- Athletes -->
  <section id="atletas-section">
    <div class="header reveal">
      <div class="section-eyebrow">Nossa equipe</div>
      <h2 class="section-title">Os Black Horses</h2>
    </div>

    <!-- Team photo -->
    <div class="team-photo-wrap reveal">
      <img src="assets/images/atletas/comp/atlletas_comp.webp" alt="Equipe de competição Black Horses">
    </div>

    <!-- Athletes grid -->
    <div class="atletas-grid">

      <div class="atleta-card reveal">
        <div class="atleta-photo-wrap">
          <img class="atleta-photo" src="assets/images/atletas/portraits/Donay_1_1.webp" alt="Amanda Donay">
          <div class="atleta-photo-overlay"></div>
        </div>
        <div class="atleta-info">
          <div class="atleta-name">Amanda Donay</div>
          <div class="atleta-belts">
            <img class="atleta-belt" src="assets/icons/white_minima_belt.webp" alt="cinturão">
            <img class="atleta-belt" src="assets/icons/white_minima_belt.webp" alt="cinturão">
          </div>
          <div class="atleta-medals">
            <img class="atleta-medal" src="assets/icons/icons8-medal-100.png" alt="medalha">
          </div>
        </div>
      </div>

      <div class="atleta-card reveal">
        <div class="atleta-photo-wrap">
          <img class="atleta-photo" src="assets/images/atletas/portraits/Wheyder_1_1.webp" alt="Wheyder">
          <div class="atleta-photo-overlay"></div>
        </div>
        <div class="atleta-info">
          <div class="atleta-name">Wheyder</div>
          <div class="atleta-belts">
            <img class="atleta-belt" src="assets/icons/white_minima_belt.webp" alt="cinturão">
          </div>
          <div class="atleta-medals">
            <img class="atleta-medal" src="assets/icons/icons8-medal-100.png" alt="medalha">
          </div>
        </div>
      </div>

      <div class="atleta-card reveal">
        <div class="atleta-photo-wrap">
          <img class="atleta-photo" src="assets/images/atletas/portraits/Dudu_1_1.webp" alt="Eduardo Barbosa">
          <div class="atleta-photo-overlay"></div>
        </div>
        <div class="atleta-info">
          <div class="atleta-name">Eduardo Barbosa</div>
          <div class="atleta-belts"></div>
          <div class="atleta-medals">
            <img class="atleta-medal" src="assets/icons/icons8-medal-100.png" alt="medalha">
          </div>
        </div>
      </div>

      <div class="atleta-card reveal">
        <div class="atleta-photo-wrap">
          <img class="atleta-photo" src="assets/images/atletas/portraits/Pedro_1_1.webp" alt="Pedro Nunes">
          <div class="atleta-photo-overlay"></div>
        </div>
        <div class="atleta-info">
          <div class="atleta-name">Pedro Nunes</div>
          <div class="atleta-belts"></div>
          <div class="atleta-medals">
            <img class="atleta-medal" src="assets/icons/icons8-medal-100.png" alt="medalha">
          </div>
        </div>
      </div>

      <div class="atleta-card reveal">
        <div class="atleta-photo-wrap">
          <img class="atleta-photo" src="assets/images/atletas/portraits/Gabriel_1_1.webp" alt="Gabriel">
          <div class="atleta-photo-overlay"></div>
        </div>
        <div class="atleta-info">
          <div class="atleta-name">Gabriel</div>
          <div class="atleta-belts"></div>
          <div class="atleta-medals">
            <img class="atleta-medal" src="assets/icons/icons8-medal-100.png" alt="medalha">
          </div>
        </div>
      </div>

      <div class="atleta-card reveal">
        <div class="atleta-photo-wrap">
          <img class="atleta-photo" src="assets/images/atletas/portraits/Otavio_3_4.jpeg" alt="Otavio Bresolin">
          <div class="atleta-photo-overlay"></div>
        </div>
        <div class="atleta-info">
          <div class="atleta-name">Otavio Bresolin</div>
          <div class="atleta-belts"></div>
          <div class="atleta-medals">
            <img class="atleta-medal" src="assets/icons/icons8-medal-100.png" alt="medalha">
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Competition photos -->
  <section id="comp-section">
    <div class="header reveal">
      <div class="section-eyebrow">Na arena</div>
      <h2 class="section-title">Competições</h2>
    </div>

    <div class="comp-group">
      <div class="comp-group-title reveal">Treinos</div>
      <div class="comp-collapse">
        <div class="comp-grid">
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/UCS12167.webp" alt="Treino"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/UCS12252.webp" alt="Treino"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/UCS19561.webp" alt="Treino"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/UCS19634.webp" alt="Treino"></div>
        </div>
        <div class="comp-fade"></div>
      </div>
      <button class="comp-ver-mais">Ver mais fotos ↓</button>
    </div>

    <div class="comp-group">
      <div class="comp-group-title reveal">Copa Predadores 2026</div>
      <div class="comp-collapse">
        <div class="comp-grid">
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/copa_predadora_2026/WhatsApp Image 2026-05-06 at 21.16.41.jpeg" alt="Copa Predadores 2026"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/copa_predadora_2026/WhatsApp Image 2026-05-06 at 21.16.42.jpeg" alt="Copa Predadores 2026"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/copa_predadora_2026/WhatsApp Image 2026-05-06 at 21.16.42 (1).jpeg" alt="Copa Predadores 2026"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/copa_predadora_2026/WhatsApp Image 2026-05-06 at 21.16.42 (2).jpeg" alt="Copa Predadores 2026"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/copa_predadora_2026/WhatsApp Image 2026-05-06 at 21.16.42 (3).jpeg" alt="Copa Predadores 2026"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/copa_predadora_2026/WhatsApp Image 2026-05-06 at 21.16.43.jpeg" alt="Copa Predadores 2026"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/copa_predadora_2026/WhatsApp Image 2026-05-06 at 21.16.43 (1).jpeg" alt="Copa Predadores 2026"></div>
          <div class="comp-photo reveal"><img src="assets/images/atletas/comp/copa_predadora_2026/WhatsApp Image 2026-05-06 at 21.16.43 (2).jpeg" alt="Copa Predadores 2026"></div>
        </div>
        <div class="comp-fade"></div>
      </div>
      <button class="comp-ver-mais">Ver mais fotos ↓</button>
    </div>

  </section>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lightbox-close">✕</button>
    <button id="lightbox-prev">&#8592;</button>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-next">&#8594;</button>
  </div>

  <!-- Footer -->

  <script src="assets/js/bh-app.js"></script>
  <script src="assets/js/atletas.js"></script>
  <script src="assets/components/footer.js"></script>
</body>
</html>
