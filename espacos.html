<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/images/logos/logo_redux_transparent.png" type="image/png">
  <meta name="description" content="Conheça as instalações da Black Horses Artes Marciais. Estrutura completa para treinos em Porto Alegre.">
  <title>Espaços — Black Horses</title>
  <link rel="stylesheet" href="assets/css/bh-style.css">
  <link rel="stylesheet" href="assets/css/espacos.css">
</head>
<body>
  <script src="assets/components/nav.js"></script>

  <!-- Loading -->
  <div id="bh-loading">
    <img src="assets/images/logos/logo_redux_transparent.png" alt="" class="load-icon">
    <div class="load-bar"><div class="load-bar-fill"></div></div>
  </div>

  <!-- Hero -->
  <div class="page-hero">
    <img src="assets/images/espacos/espaço1.jpeg" alt="Espaço Black Horses">
    <div class="page-hero-fade"></div>
    <div class="page-hero-content">
      <div class="page-eyebrow">Nossa estrutura</div>
      <h1 class="page-title">Espaços</h1>
    </div>
  </div>

  <!-- Video -->
  <section id="video-section">
    <div class="header reveal">
      <div class="section-eyebrow">Conheça</div>
      <h2 class="section-title">Nossa Academia</h2>
    </div>
    <div class="video-wrap reveal">
      <iframe src="https://www.youtube.com/embed/jLPyoFHS7Es?si=ut11SiOqh4ZV2_Xn"
        title="Black Horses" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen loading="lazy"></iframe>
    </div>
  </section>

  <!-- Amenities -->
  <section id="amenities-section">
    <div class="header reveal">
      <div class="section-eyebrow">O que temos</div>
      <h2 class="section-title">Estrutura</h2>
    </div>
    <div class="amenities-grid">
      <div class="amenity-item reveal"><img src="assets/icons/spaces/icons8-wc-100.png" alt=""><span>Banheiro</span></div>
      <div class="amenity-item reveal"><img src="assets/icons/spaces/icons8-skipping-rope-66.png" alt=""><span>Cordas</span></div>
      <div class="amenity-item reveal"><img src="assets/icons/spaces/icons8-gym-64.png" alt=""><span>Pesos</span></div>
      <div class="amenity-item reveal"><img src="assets/icons/spaces/icons8-shower-64.png" alt=""><span>Chuveiro</span></div>
      <div class="amenity-item reveal"><img src="assets/icons/spaces/icons8-boxing-64.png" alt=""><span>Bolsas</span></div>
      <div class="amenity-item reveal"><img src="assets/icons/spaces/icons8-barbecue-64.png" alt=""><span>Lazer</span></div>
      <div class="amenity-item reveal"><img src="assets/icons/spaces/icons8-boxing-gloves-66.png" alt=""><span>Aparadores</span></div>
      <div class="amenity-item reveal"><img src="assets/icons/spaces/icons8-coffee-64.png" alt=""><span>Café</span></div>
    </div>
  </section>

  <!-- Photos -->
  <section id="fotos-section">
    <div class="header reveal">
      <div class="section-eyebrow">Fotos</div>
      <h2 class="section-title">Galeria</h2>
    </div>
    <div class="fotos-grid">
      <div class="foto-item reveal" data-idx="0"><img src="assets/images/espacos/espaço1.jpeg" alt="Academia"></div>
      <div class="foto-item reveal" data-idx="1"><img src="assets/images/espacos/espaço2.jpeg" alt="Academia"></div>
      <div class="foto-item reveal" data-idx="2"><img src="assets/images/espacos/espaço3.jpeg" alt="Academia"></div>
      <div class="foto-item reveal" data-idx="3"><img src="assets/images/espacos/espaço4.jpeg" alt="Academia"></div>
      <div class="foto-item reveal" data-idx="4"><img src="assets/images/espacos/espaço5.jpeg" alt="Academia"></div>
      <div class="foto-item reveal" data-idx="5"><img src="assets/images/espacos/espaço6.jpeg" alt="Academia"></div>
    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lb-close">✕</button>
    <button id="lb-prev">&#8592;</button>
    <img id="lb-img" src="" alt="">
    <button id="lb-next">&#8594;</button>
  </div>

  <script src="assets/js/bh-app.js"></script>
  <script src="assets/js/espacos.js"></script>
  <script src="assets/components/footer.js"></script>
</body>
</html>
